### 短信密码重置被拒绝的原因。
enum: SmsPasswordResetExceptionReason
serialized: byName
default: unknown
values:
  ### 无效的 token、验证码或手机号。
  - invalid
  ### 同一请求尝试次数过多。
  - tooManyAttempts
  ### 请求已过期。
  - expired
  ### 密码不符合策略。
  - policyViolation
  ### 新密码与旧密码相同。
  - samePassword
  ### 新旧写法对上两个账号。
  - phoneIdentityConflict
  ### 未知错误。
  - unknown
