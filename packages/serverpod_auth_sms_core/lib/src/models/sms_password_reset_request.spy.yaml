### 待完成的短信密码重置请求。
class: SmsPasswordResetRequest
serverOnly: true
table: serverpod_auth_sms_password_reset_request
fields:
  id: UuidValue?, defaultPersist=random_v7
  createdAt: DateTime, default=now
  phoneHash: String
  authUser: module:auth:AuthUser?, relation(onDelete=Cascade, optional)
  blockedReason: SmsPasswordResetBlockedReason?
  challenge: module:idp:SecretChallenge?, relation(onDelete=Cascade)
  resetChallenge: module:idp:SecretChallenge?, relation(onDelete=Cascade, optional)

indexes:
  serverpod_auth_sms_password_reset_request_phone_hash:
    fields: phoneHash
    unique: true
